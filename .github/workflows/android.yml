name: Android Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android-build:
    name: Build Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        shell: bash
        run: |
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          cargo build --release --target aarch64-linux-android -p openfang-cli

      - name: Package
        run: |
          cd target/aarch64-linux-android/release
          tar czf ../../../openfang-aarch64-linux-android.tar.gz openfang

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openfang-android-aarch64
          path: openfang-aarch64-linux-android.tar.gz
          retention-days: 30