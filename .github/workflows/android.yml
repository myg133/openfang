name: Android Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android-build:
    name: Build Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -C /opt/
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r25b" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "/opt/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          EOF

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --target aarch64-linux-android --release -p openfang-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfang-android-aarch64
          path: target/aarch64-linux-android/release/openfang
          retention-days: 30